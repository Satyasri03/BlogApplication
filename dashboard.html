
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Blog</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main>
        <h2>Welcome to Your Blog Dashboard!</h2>
        <p>Manage your published blog posts here.</p>

        <p>
            <a href="create-blog.html">
                <button type="button">Create New Blog</button>
            </a>
        </p>

        <section>
            <h3>My Blog Posts</h3>
            <div id="blogList"></div>
        </section>
    </main>

    <script>
        const blogList = document.getElementById("blogList");

        function displayBlogs() {
            blogList.innerHTML = "";

            const blogs = JSON.parse(
                localStorage.getItem("myBlogs") || "[]"
            );

            if (blogs.length === 0) {
                blogList.textContent =
                    "You have not created any blog posts yet.";
                return;
            }

            blogs.forEach(function(blog, index) {
                const article = document.createElement("article");

                article.style.textAlign = "left";
                article.style.padding = "20px";
                article.style.margin = "20px 0";
                article.style.border = "1px solid #dbe3f0";
                article.style.borderRadius = "10px";

                const heading = document.createElement("h3");
                heading.textContent = blog.title;

                const content = document.createElement("p");
                content.textContent = blog.content;
                content.style.margin = "12px 0";

                const date = document.createElement("p");
                date.textContent = "Published: " + (blog.date || "");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit Blog";
                editButton.style.marginRight = "10px";

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete Blog";
                deleteButton.style.backgroundColor = "#dc2626";

                editButton.addEventListener("click", function() {
                    showEditForm(article, index, blog);
                });

                deleteButton.addEventListener("click", function() {
                    if (confirm("Are you sure you want to delete this blog?")) {
                        const savedBlogs = JSON.parse(
                            localStorage.getItem("myBlogs") || "[]"
                        );

                        savedBlogs.splice(index, 1);

                        localStorage.setItem(
                            "myBlogs",
                            JSON.stringify(savedBlogs)
                        );

                        displayBlogs();
                    }
                });

                article.appendChild(heading);
                article.appendChild(content);
                article.appendChild(date);
                article.appendChild(document.createElement("br"));
                article.appendChild(editButton);
                article.appendChild(deleteButton);

                blogList.appendChild(article);
            });
        }

        function showEditForm(article, index, blog) {
            article.innerHTML = "";

            const heading = document.createElement("h3");
            heading.textContent = "Edit Blog";

            const titleInput = document.createElement("input");
            titleInput.type = "text";
            titleInput.value = blog.title;
            titleInput.placeholder = "Blog Title";
            titleInput.required = true;
            titleInput.style.margin = "12px 0";

            const contentInput = document.createElement("textarea");
            contentInput.value = blog.content;
            contentInput.placeholder = "Write your blog here...";
            contentInput.rows = 6;
            contentInput.required = true;
            contentInput.style.margin = "12px 0";

            const saveButton = document.createElement("button");
            saveButton.textContent = "Save Changes";

            const cancelButton = document.createElement("button");
            cancelButton.textContent = "Cancel";
            cancelButton.type = "button";
            cancelButton.style.backgroundColor = "#64748b";
            cancelButton.style.marginLeft = "10px";

            saveButton.addEventListener("click", function() {
                const newTitle = titleInput.value.trim();
                const newContent = contentInput.value.trim();

                if (!newTitle || !newContent) {
                    alert("Please enter both title and content.");
                    return;
                }

                const savedBlogs = JSON.parse(
                    localStorage.getItem("myBlogs") || "[]"
                );

                if (!savedBlogs[index]) {
                    alert("Blog not found. Please refresh the page.");
                    displayBlogs();
                    return;
                }

                savedBlogs[index].title = newTitle;
                savedBlogs[index].content = newContent;

                localStorage.setItem(
                    "myBlogs",
                    JSON.stringify(savedBlogs)
                );

                alert("Blog updated successfully!");
                displayBlogs();
            });

            cancelButton.addEventListener("click", function() {
                displayBlogs();
            });

            article.appendChild(heading);
            article.appendChild(titleInput);
            article.appendChild(contentInput);
            article.appendChild(document.createElement("br"));
            article.appendChild(saveButton);
            article.appendChild(cancelButton);
        }

        displayBlogs();
    </script>

</body>
</html>
